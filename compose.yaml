services:
  postgres:
    image: postgres:17
    container_name: mon_api_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mon_api_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: passe
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: